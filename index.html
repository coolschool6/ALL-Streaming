<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLStreaming</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo">ALLStreaming</a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <button class="nav-btn active" data-filter="all">Home</button>
        <button class="nav-btn" data-filter="movie">Movies</button>
        <button class="nav-btn" data-filter="tv">Shows</button>
      </div>
    </div>
    <div class="nav-right">
      <div id="sub-badge" class="subscription-badge" style="display:none;" title="Subscription Status">
        <span class="badge-text">⏳ <span id="sub-days-left">0</span> days left</span>
        <button id="btn-logout" class="logout-btn" title="Log out">&times;</button>
      </div>
      <button class="search-toggle" id="search-toggle" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="Search movies & TV shows..." autocomplete="off" spellcheck="false">
        <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
      </div>
    </div>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge" id="hero-badge"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-overview" id="hero-overview"></p>
      <div class="hero-actions">
        <button class="btn-watch" id="btn-watch">Watch now</button>
        <button class="btn-info" id="btn-info">More info</button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <main id="content">
    <div class="loading-screen" id="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <div class="player-modal" id="player-modal">
    <div class="player-header">
      <button class="player-close" id="player-close" aria-label="Close player">&times;</button>
      <span class="player-title" id="player-title"></span>
      <div class="tv-controls" id="tv-controls" style="display:none;">
        <select id="season-select"></select>
        <select id="episode-select"></select>
      </div>
    </div>
    <div class="player-wrap">
      <iframe id="player-iframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>

  <div class="detail-modal" id="detail-modal">
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <div class="detail-overlay"></div>
    <div class="detail-content">
      <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      <div class="detail-inner">
        <div class="detail-poster" id="detail-poster"></div>
        <div class="detail-info">
          <h2 class="detail-title" id="detail-title"></h2>
          <div class="detail-meta" id="detail-meta"></div>
          <p class="detail-overview" id="detail-overview"></p>
          <div class="detail-actions">
            <button class="btn-watch" id="detail-watch">Watch now</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MANUAL PAYWALL MODAL -->
  <div id="paywall-overlay" class="paywall-modal" style="display: none;">
    <div class="paywall-content">
      <h2>🔒 ALLStreaming Access</h2>
      <p>This service costs <strong>100 TTD / month</strong>.</p>
      <p class="paywall-instructions">
        Pay via bank transfer and send your receipt on WhatsApp to receive your 30-day key.
      </p>
      
      <input type="text" id="key-input" placeholder="Enter your 30-day key..." autocomplete="off" />
      <button id="btn-activate" class="btn-watch" style="width:100%; margin-bottom: 12px;">Activate Key</button>
      
      <a href="https://wa.me/1868YOURNUMBER?text=Hi,%20I%20want%20to%20buy%20a%2030-day%20access%20key%20for%20ALLStreaming%20(100%20TTD).%20Here%20is%20my%20bank%20transfer%20receipt:" 
         target="_blank" 
         class="whatsapp-btn">
         💬 Buy via WhatsApp (Bank Transfer)
      </a>
      
      <p id="paywall-error" class="paywall-error"></p>
    </div>
  </div>

  <style>
  .subscription-badge {
    background: rgba(37, 211, 102, 0.15);
    border: 1px solid #25d366;
    color: #25d366;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 15px;
    white-space: nowrap;
  }
  .paywall-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    z-index: 100000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .paywall-content {
    background: #18181b;
    color: #fff;
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .paywall-content h2 {
    font-family: 'Grenze Gotisch', serif;
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--accent);
  }
  .paywall-content p {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .paywall-content strong {
    color: #fff;
  }
  .paywall-instructions {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .paywall-content input {
    width: 100%;
    padding: 14px 16px;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    text-align: center;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .paywall-content input:focus {
    border-color: var(--accent);
  }
  .whatsapp-btn {
    display: block;
    background: #25d366;
    color: #fff;
    padding: 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    margin-top: 8px;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
  }
  .whatsapp-btn:hover {
    opacity: 0.9;
  }
  .whatsapp-btn:active {
    transform: scale(0.98);
  }
  .paywall-error {
    color: #ff4d4d;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
  .logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: #aaa;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    color: #ff4d4d;
    border-color: #ff4d4d;
  }
  @media (max-width: 480px) {
    .paywall-content {
      padding: 24px 20px;
    }
    .paywall-content h2 {
      font-size: 24px;
    }
  }
  </style>

  <script src="app.js"></script>
</body>
</html>
