<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; media-src 'self' blob: https:; connect-src 'self' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; worker-src 'self' blob:;">
  <title>ALLStreaming</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function(){
      var et = localStorage.getItem('asfr_expiry_time');
      if (!et || Date.now() >= parseInt(et, 10)) {
        document.documentElement.style.display = 'none';
      }
    })();
  </script>
  <script>window.si = window.si || function () { (window.si.q = window.si.q || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo">ALLStreaming</a>
      <span class="version-badge" aria-label="App version">v.1.01</span>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <button class="nav-btn active" data-filter="all">Home</button>
        <button class="nav-btn" data-filter="movie">Movies</button>
        <button class="nav-btn" data-filter="tv">Shows</button>
      </div>
    </div>
    <div class="nav-right">
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="pt">PT</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
        <option value="zh">ZH</option>
        <option value="hi">HI</option>
        <option value="ar">AR</option>
        <option value="ru">RU</option>
        <option value="tr">TR</option>
        <option value="th">TH</option>
      </select>
      <div id="sub-badge" class="subscription-badge" style="display:none;" title="Subscription Status">
        <span class="badge-text">⏳ <span id="sub-days-left">0</span> days left</span>
        <button id="btn-logout" class="logout-btn" title="Log out">&times;</button>
      </div>
      <button class="search-toggle" id="search-toggle" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="Search movies & TV shows..." autocomplete="off" spellcheck="false">
        <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
      </div>
    </div>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge" id="hero-badge"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-overview" id="hero-overview"></p>
      <div class="hero-actions">
        <button class="btn-watch" id="btn-watch">Watch now</button>
        <button class="btn-info" id="btn-info">More info</button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <main id="content">
    <div class="loading-screen" id="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <div class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-nav-btn active" id="mobile-nav-home" data-action="home" aria-label="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="mobile-nav-btn" id="mobile-nav-search" data-action="search" aria-label="Search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </button>
    <button class="mobile-nav-btn" id="mobile-nav-library" data-action="library" aria-label="Library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Library</span>
    </button>
  </div>

  <!-- FULL-SCREEN SEARCH OVERLAY -->
  <div class="search-overlay hidden" id="search-overlay">
    <div class="search-overlay-header">
      <input type="text" id="search-overlay-input" placeholder="Search movies & TV shows..." autocomplete="off" spellcheck="false">
      <button class="search-overlay-close" id="search-overlay-close" aria-label="Close search">&times;</button>
    </div>
    <div class="search-overlay-results" id="search-overlay-results"></div>
  </div>

  <div class="player-modal" id="player-modal">
    <div class="player-header">
      <button class="player-close" id="player-close" aria-label="Close player">&times;</button>
      <span class="player-title" id="player-title"></span>
      <span class="player-subtitle" id="player-subtitle"></span>
      <div class="tv-controls" id="tv-controls" style="display:none;">
        <select id="season-select"></select>
        <select id="episode-select"></select>
      </div>
      <div class="player-settings" id="player-settings" aria-hidden="true">
        <div class="setting-group" data-group="quality">
          <span class="setting-chip setting-chip--active" data-setting="quality" data-value="default">Auto</span>
        </div>
      </div>
    </div>
    <div class="player-wrap">
      <div id="player-shield" class="player-shield" onclick="this.style.display='none'" title="Tap to interact with player"></div>
      <iframe id="player-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="player-loader hidden" id="player-loader">
        <div class="spinner"></div>
        <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
        <div class="loader-status" id="loader-status">Loading stream...</div>
        <div class="loader-count" id="loader-count"></div>
      </div>
      <video id="hls-video" class="hls-video" crossorigin playsinline webkit-playsinline style="display:none; width:100%; height:100%;"></video>
      <div id="player-overlay"></div>
      <div class="nf-controls" id="nf-controls">
        <div class="nf-actions">
          <button class="nf-skip-intro" id="nf-skip-intro" style="display:none;" aria-label="Skip Intro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            <span>Skip Intro</span>
          </button>
        </div>

        <div class="nf-center" id="nf-center">
          <button class="nf-play-big" id="nf-play-big" aria-label="Play">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>

        <div class="nf-bottom">
          <div class="nf-progress" id="nf-progress" aria-label="Seek">
            <div class="nf-buffered" id="nf-buffered"></div>
            <div class="nf-played" id="nf-played"></div>
            <div class="nf-scrubber" id="nf-scrubber"></div>
            <div class="nf-tooltip" id="nf-tooltip"></div>
          </div>
          <div class="nf-bottom-row">
            <button class="nf-btn" id="nf-play" aria-label="Play/Pause">
              <svg id="nf-play-ic" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="nf-btn" id="player-skip-back" title="Back 10 seconds" aria-label="Back 10 seconds">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
            <button class="nf-btn" id="player-skip-forward" title="Forward 10 seconds" aria-label="Forward 10 seconds">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
            </button>
            <div class="nf-volwrap">
              <button class="nf-btn" id="nf-mute" aria-label="Mute">
                <svg id="nf-vol-ic" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </button>
              <div class="nf-volpop">
                <input type="range" id="nf-vol" min="0" max="100" value="100" aria-label="Volume">
              </div>
            </div>
            <span class="nf-time" id="nf-time">0:00 / 0:00</span>
            <div class="nf-grow"></div>
            <div class="nf-settingswrap">
              <button class="nf-btn" id="nf-settings-btn" aria-label="Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94c0-.32-.02-.63-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.83 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0-.05.94c0 .32.02.63.05.94L2.95 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.67.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.24.42.49.42h3.84c.25 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.25.12.53.02.67-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
              </button>
              <div class="nf-menu hidden" id="nf-menu">
                <div class="nf-menu-group">
                  <div class="nf-menu-title">Playback Speed</div>
                  <div class="nf-menu-opts" id="nf-speed-opts"></div>
                </div>
              </div>
            </div>
            <button class="nf-btn" id="nf-pip" style="display:none;" aria-label="Picture in Picture">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg>
            </button>
            <button class="nf-btn" id="nf-fullscreen" aria-label="Fullscreen">
              <svg id="nf-fs-ic" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
            <button class="nf-btn" id="player-next" title="Play next episode" style="display:none;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
          </div>
        </div>

        <div class="nf-flash" id="nf-flash" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="detail-modal" id="detail-modal">
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <div class="detail-overlay"></div>
    <div class="detail-content">
      <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      <div class="detail-inner">
        <div class="detail-poster" id="detail-poster"></div>
        <div class="detail-info">
          <h2 class="detail-title" id="detail-title"></h2>
          <div class="detail-meta" id="detail-meta"></div>
          <p class="detail-overview" id="detail-overview"></p>
          <div class="detail-actions">
            <button class="btn-watch" id="detail-watch">Watch now</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FULL-PAGE SHOW VIEW (Dulo-style) -->
  <div class="show-page" id="show-page">
    <div class="show-backdrop" id="show-backdrop"></div>
    <div class="show-backdrop-gradient"></div>
    <div class="show-top-bar">
      <button class="show-back-btn" id="show-back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Back</span>
      </button>
    </div>
    <div class="show-header">
      <h1 class="show-title" id="show-title"></h1>
      <div class="show-meta" id="show-meta"></div>
    </div>
    <div class="show-availability hidden" id="show-availability"></div>
    <div class="show-toolbar">
      <div class="season-selector" id="season-selector">
        <button class="season-btn" id="season-btn">Season 1 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="season-dropdown" id="season-dropdown"></div>
      </div>
    </div>
    <div class="show-episodes" id="show-episodes">
      <div class="episodes-loading" id="episodes-loading">
        <div class="spinner"></div>
      </div>
    </div>
    <div class="show-synopsis" id="show-synopsis"></div>
    <div class="show-similar">
      <h3 class="show-similar-title">More Like This</h3>
      <div class="show-similar-track" id="show-similar-track"></div>
    </div>
  </div>

  <!-- MANUAL PAYWALL MODAL -->
  <div id="paywall-overlay" class="paywall-modal" style="display: none;">
    <div class="paywall-content">
      <h2>🔒 ALLStreaming Access</h2>
      <p>This service costs <strong>200 TTD / month</strong>.</p>
      <p class="paywall-instructions">
        Pay via bank transfer and send your receipt on WhatsApp to receive your 30-day key.
      </p>
      
      <input type="text" id="key-input" placeholder="Enter your 30-day key..." autocomplete="off" />
      <button id="btn-activate" class="btn-watch" style="width:100%; margin-bottom: 12px;">Activate Key</button>
      
      <a href="https://wa.me/18683925275?text=Hi,%20I%20want%20to%20buy%20a%2030-day%20access%20key%20for%20ALLStreaming%20(200%20TTD).%20Here%20is%20my%20bank%20transfer%20receipt:" 
         target="_blank" 
         class="whatsapp-btn">
         💬 Buy via WhatsApp (Bank Transfer)
      </a>
      
      <p id="paywall-error" class="paywall-error"></p>
    </div>
  </div>

  <style>
  .subscription-badge {
    background: rgba(37, 211, 102, 0.15);
    border: 1px solid #25d366;
    color: #25d366;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 15px;
    white-space: nowrap;
  }
  .paywall-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    z-index: 100000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .paywall-content {
    background: #18181b;
    color: #fff;
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .paywall-content h2 {
    font-family: 'Grenze Gotisch', serif;
    font-size: clamp(1.5rem, 5vw, 1.75rem);
    margin-bottom: 12px;
    color: var(--accent);
  }
  .paywall-content p {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .paywall-content strong {
    color: #fff;
  }
  .paywall-instructions {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .paywall-content input {
    width: 100%;
    padding: 14px 16px;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    text-align: center;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
    min-height: 48px;
  }
  .paywall-content input:focus {
    border-color: var(--accent);
  }
  .whatsapp-btn {
    display: block;
    background: #25d366;
    color: #fff;
    padding: 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    margin-top: 8px;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .whatsapp-btn:hover {
    opacity: 0.9;
  }
  .whatsapp-btn:active {
    transform: scale(0.98);
  }
  .paywall-error {
    color: #ff4d4d;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
  .logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: #aaa;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    color: #ff4d4d;
    border-color: #ff4d4d;
  }
  @media (max-width: 480px) {
    .paywall-content {
      padding: 24px 20px;
    }
  }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="app.js"></script>
</body>
</html>
