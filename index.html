<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">StreamApp</div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search movies or TV shows...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <section id="hero-section">
            <!-- Dynamic Hero Banner / Featured Content -->
        </section>

        <section id="media-grid-section">
            <h2>Trending Movies & Shows</h2>
            <div id="media-grid" class="grid">
                <!-- Media cards will be injected here via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Video Player Modal with Click Shield -->
    <div id="player-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            
            <div class="server-selector">
                <label for="server-select">Choose Server:</label>
                <select id="server-select">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="player-body" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000;">
                <!-- Transparent shield that blocks initial touch-jacking overlays on mobile -->
                <div id="player-shield" style="position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer;">
                    <div style="background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; font-family: sans-serif; border: 1px solid rgba(255,255,255,0.2);">
                        Tap to Enable Player
                    </div>
                </div>

                <iframe 
                    id="player-iframe" 
                    src="" 
                    style="width: 100%; height: 100%; border: none;"
                    sandbox="allow-scripts allow-same-origin allow-presentation"
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
