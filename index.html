<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; media-src 'self' blob: https:; connect-src 'self' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; worker-src 'self' blob:;">
  <title>ALLStreaming</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script>
    (function(){
      var et = localStorage.getItem('asfr_expiry_time');
      if (!et || Date.now() >= parseInt(et, 10)) {
        document.documentElement.style.display = 'none';
      }
    })();
  </script>
  <script>window.si = window.si || function () { (window.si.q = window.si.q || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="logo">ALLStreaming</a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <button class="nav-btn active" data-filter="all">Home</button>
        <button class="nav-btn" data-filter="movie">Movies</button>
        <button class="nav-btn" data-filter="tv">Shows</button>
      </div>
    </div>
    <div class="nav-right">
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="fr">FR</option>
        <option value="pt">PT</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
        <option value="zh">ZH</option>
        <option value="hi">HI</option>
        <option value="ar">AR</option>
        <option value="ru">RU</option>
        <option value="tr">TR</option>
        <option value="th">TH</option>
      </select>
      <div id="sub-badge" class="subscription-badge" style="display:none;" title="Subscription Status">
        <span class="badge-text">⏳ <span id="sub-days-left">0</span> days left</span>
        <button id="btn-logout" class="logout-btn" title="Log out">&times;</button>
      </div>
      <button class="search-toggle" id="search-toggle" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="search-bar" id="search-bar">
        <input type="text" id="search-input" placeholder="Search movies & TV shows..." autocomplete="off" spellcheck="false">
        <button class="search-close" id="search-close" aria-label="Close search">&times;</button>
      </div>
    </div>
  </nav>

  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-badge" id="hero-badge"></span>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-overview" id="hero-overview"></p>
      <div class="hero-actions">
        <button class="btn-watch" id="btn-watch">Watch now</button>
        <button class="btn-info" id="btn-info">More info</button>
      </div>
    </div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <main id="content">
    <div class="loading-screen" id="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <div class="player-modal" id="player-modal">
    <div class="player-header">
      <button class="player-close" id="player-close" aria-label="Close player">&times;</button>
      <span class="player-title" id="player-title"></span>
      <div class="tv-controls" id="tv-controls" style="display:none;">
        <select id="season-select"></select>
        <select id="episode-select"></select>
      </div>
      <div class="player-settings" id="player-settings">
        <div class="setting-group" data-group="quality">
          <span class="setting-chip setting-chip--active" data-setting="quality" data-value="default">Auto</span>
        </div>
        <div class="setting-group" data-group="speed">
          <span class="setting-chip setting-chip--active" data-setting="speed" data-value="1">1x</span>
          <span class="setting-chip" data-setting="speed" data-value="1.5">1.5x</span>
          <span class="setting-chip" data-setting="speed" data-value="2">2x</span>
        </div>
        <div class="setting-group" data-group="buffer">
          <span class="setting-chip setting-chip--active" data-setting="buffer" data-value="30">30s</span>
          <span class="setting-chip" data-setting="buffer" data-value="60">60s</span>
        </div>
        <div class="setting-group" data-group="codec">
          <span class="setting-chip setting-chip--active" data-setting="codec" data-value="default">Auto</span>
          <span class="setting-chip" data-setting="codec" data-value="avc">AVC</span>
        </div>
        <div class="setting-group" data-group="audio">
          <span class="setting-chip setting-chip--active" data-setting="audio" data-value="-1">Auto</span>
        </div>
        <div class="setting-group" data-group="subs">
          <span class="setting-chip setting-chip--active" data-setting="subs" data-value="-1">Off</span>
        </div>
      </div>
    </div>
    <div class="player-wrap">
      <div id="player-shield" class="player-shield" onclick="this.style.display='none'" title="Tap to interact with player"></div>
      <div id="source-label" class="source-label" style="display:none"></div>
      <iframe id="player-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="player-loader hidden" id="player-loader">
        <div class="spinner"></div>
        <div class="loader-status" id="loader-status">Loading stream...</div>
      </div>
      <video id="hls-video" class="hls-video" crossorigin playsinline webkit-playsinline style="display:none; width:100%; height:100%;"></video>
      <div id="player-overlay"></div>
    </div>
    <div class="player-controls" id="player-controls">
      <button class="player-btn" id="player-skip-back" title="Skip back 10s">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button class="player-btn" id="player-skip-forward" title="Skip forward 10s">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
    </div>
  </div>

  <div class="detail-modal" id="detail-modal">
    <div class="detail-backdrop" id="detail-backdrop"></div>
    <div class="detail-overlay"></div>
    <div class="detail-content">
      <button class="detail-close" id="detail-close" aria-label="Close">&times;</button>
      <div class="detail-inner">
        <div class="detail-poster" id="detail-poster"></div>
        <div class="detail-info">
          <h2 class="detail-title" id="detail-title"></h2>
          <div class="detail-meta" id="detail-meta"></div>
          <p class="detail-overview" id="detail-overview"></p>
          <div class="detail-actions">
            <button class="btn-watch" id="detail-watch">Watch now</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FULL-PAGE SHOW VIEW (Dulo-style) -->
  <div class="show-page" id="show-page">
    <div class="show-backdrop" id="show-backdrop"></div>
    <div class="show-backdrop-gradient"></div>
    <div class="show-top-bar">
      <button class="show-back-btn" id="show-back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Back</span>
      </button>
    </div>
    <div class="show-header">
      <h1 class="show-title" id="show-title"></h1>
      <div class="show-meta" id="show-meta"></div>
    </div>
    <div class="show-toolbar">
      <div class="season-selector" id="season-selector">
        <button class="season-btn" id="season-btn">Season 1 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="season-dropdown" id="season-dropdown"></div>
      </div>
    </div>
    <div class="show-episodes" id="show-episodes">
      <div class="episodes-loading" id="episodes-loading">
        <div class="spinner"></div>
      </div>
    </div>
    <div class="show-synopsis" id="show-synopsis"></div>
    <div class="show-similar">
      <h3 class="show-similar-title">More Like This</h3>
      <div class="show-similar-track" id="show-similar-track"></div>
    </div>
  </div>

  <!-- MANUAL PAYWALL MODAL -->
  <div id="paywall-overlay" class="paywall-modal" style="display: none;">
    <div class="paywall-content">
      <h2>🔒 ALLStreaming Access</h2>
      <p>This service costs <strong>200 TTD / month</strong>.</p>
      <p class="paywall-instructions">
        Pay via bank transfer and send your receipt on WhatsApp to receive your 30-day key.
      </p>
      
      <input type="text" id="key-input" placeholder="Enter your 30-day key..." autocomplete="off" />
      <button id="btn-activate" class="btn-watch" style="width:100%; margin-bottom: 12px;">Activate Key</button>
      
      <a href="https://wa.me/18683925275?text=Hi,%20I%20want%20to%20buy%20a%2030-day%20access%20key%20for%20ALLStreaming%20(200%20TTD).%20Here%20is%20my%20bank%20transfer%20receipt:" 
         target="_blank" 
         class="whatsapp-btn">
         💬 Buy via WhatsApp (Bank Transfer)
      </a>
      
      <p id="paywall-error" class="paywall-error"></p>
    </div>
  </div>

  <style>
  .subscription-badge {
    background: rgba(37, 211, 102, 0.15);
    border: 1px solid #25d366;
    color: #25d366;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 15px;
    white-space: nowrap;
  }
  .paywall-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    z-index: 100000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .paywall-content {
    background: #18181b;
    color: #fff;
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .paywall-content h2 {
    font-family: 'Grenze Gotisch', serif;
    font-size: clamp(1.5rem, 5vw, 1.75rem);
    margin-bottom: 12px;
    color: var(--accent);
  }
  .paywall-content p {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .paywall-content strong {
    color: #fff;
  }
  .paywall-instructions {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .paywall-content input {
    width: 100%;
    padding: 14px 16px;
    background: #27272a;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    text-align: center;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
    min-height: 48px;
  }
  .paywall-content input:focus {
    border-color: var(--accent);
  }
  .whatsapp-btn {
    display: block;
    background: #25d366;
    color: #fff;
    padding: 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    margin-top: 8px;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .whatsapp-btn:hover {
    opacity: 0.9;
  }
  .whatsapp-btn:active {
    transform: scale(0.98);
  }
  .paywall-error {
    color: #ff4d4d;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
  .logout-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: #aaa;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    color: #ff4d4d;
    border-color: #ff4d4d;
  }
  @media (max-width: 480px) {
    .paywall-content {
      padding: 24px 20px;
    }
  }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="app.js"></script>
</body>
</html>
